services:
  - type: web
    name: moonlight-hotel
    runtime: python
    plan: free
    buildCommand: './build.sh'
    startCommand: 'gunicorn moonlight_hotel.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moonlight-hotel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: EMAIL_BACKEND
        value: 'django.core.mail.backends.smtp.EmailBackend'

databases:
  - name: moonlight-hotel-db
    plan: free