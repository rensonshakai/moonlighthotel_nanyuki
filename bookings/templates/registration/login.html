<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Moonlight Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h2 { font-family: 'Playfair Display', serif; }
        
        /* Style Django's default login inputs */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            background-color: #f9fafb;
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #312E81;
            box-shadow: 0 0 0 3px rgba(49, 46, 129, 0.1);
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen relative">

    <!-- Top Left Back Button -->
    <div class="absolute top-8 left-8">
        <a href="{% url 'home' %}" class="inline-flex items-center text-gray-600 hover:text-[#312E81] font-semibold transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Return to Home
        </a>
    </div>

    <!-- Login Card -->
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md border-t-4 border-[#312E81]">
        <div class="flex justify-center mb-4">
            <span class="text-4xl">🌙</span>
        </div>
        <h2 class="text-3xl font-bold mb-8 text-center text-gray-800">Welcome Back</h2>
        
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="w-full bg-[#312E81] text-white font-bold py-3 rounded-lg mt-4 hover:bg-indigo-900 transition shadow-md hover:shadow-lg">
                Log In
            </button>
        </form>
        
        <div class="text-center text-sm mt-6 text-gray-600 space-y-2">
            <p>Need an account? <a href="{% url 'register' %}" class="text-[#312E81] font-bold hover:underline">Sign Up</a></p>
        </div>
    </div>

</body>
</html>
