<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Moonlight Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md border-t-4 border-blue-900">
        <h2 class="text-3xl font-bold mb-8 text-center text-gray-800">Create an Account</h2>
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1 font-medium">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg mt-4 hover:bg-blue-800 transition shadow-md hover:shadow-lg">
                Sign Up
            </button>
        </form>
        <p class="text-center text-sm mt-6 text-gray-600">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-blue-900 font-bold hover:underline">Log In</a>
        </p>
    </div>
</body>
</html>
